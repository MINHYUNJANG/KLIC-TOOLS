<div class="save-modal" id="saveFileModal" hidden>
	<div class="save-modal-backdrop" id="saveFileBackdrop"></div>

				<i class="ri-close-line" aria-hidden="true"></i>
			</button>
		</div>
		<div class="save-modal-body">
			<label class="save-modal-label" for="saveFileNameInput">파일 이름</label>
			<div class="save-modal-input-row">
				<input type="text" class="save-modal-input" id="saveFileNameInput" placeholder="파일 이름 입력" maxlength="100">
			</div>
			<label class="save-modal-label" style="margin-top:16px;">저장 형식 (복수 선택 가능)</label>
			<div class="save-modal-formats">
				<label class="save-modal-format-option" data-save-format-option="klic">
					<input type="checkbox" name="saveFileFormat" value="klic" checked disabled> .klic <span style="opacity:0.6;font-size:0.85em;">(필수)</span>
				</label>
				<label class="save-modal-format-option" data-save-format-option="pdf">
					<input type="checkbox" name="saveFileFormat" value="pdf"> PDF
				</label>
				<label class="save-modal-format-option" data-save-format-option="hwpx" style="opacity:0.4;pointer-events:none;">
					<input type="checkbox" name="saveFileFormat" value="hwpx" disabled> HWPX
				</label>
			</div>
		</div>
		<div class="save-modal-footer">
			<button type="button" class="ghost-button" id="saveFileCancel">취소</button>
			<div class="save-file-progress" id="saveFileProgress" hidden>
				<div class="save-progress-bar"><div class="save-progress-fill" id="saveProgressFill"></div></div>
				<span class="save-progress-msg" id="saveProgressMsg"></span>
			</div>
			<button type="button" class="navy-button" id="saveFileConfirm">
				<i class="ri-download-line" aria-hidden="true"></i>
				다운로드
			</button>
		</div>

<script>
(function() {
	var pdfBtn = document.getElementById('savePdfButton');
	var modal = document.getElementById('saveFileModal');
	var closeModal = function() {
		if (!modal) return;
		modal.hidden = true;
		modal.setAttribute('hidden', 'hidden');
		var progress = document.getElementById('saveFileProgress');
		if (progress) progress.hidden = true;
		var confirmBtn = document.getElementById('saveFileConfirm');
		if (confirmBtn) confirmBtn.disabled = false;
	};
	document.getElementById('saveFileClose')?.addEventListener('click', closeModal);
	document.getElementById('saveFileCancel')?.addEventListener('click', closeModal);
	document.getElementById('saveFileBackdrop')?.addEventListener('click', closeModal);
	document.addEventListener('keydown', function(event) {
		if (event.key === 'Escape' && modal && !modal.hidden) closeModal();
	});
	if (!pdfBtn) return;
	pdfBtn.addEventListener('click', function() {
		if (window.__builderSaveFileOpenBound === true) return;
		if (window.__builderSaveFileOpenBound === true) return;
		// .klic은 필수 항목으로 항상 선택, PDF/HWPX는 선택 사항으로 해제
		document.querySelectorAll('input[name="saveFileFormat"]').forEach(function(cb) {
			cb.checked = (cb.value === 'klic');
		});
		// 파일명 비어있으면 기본값
		var nameInput = document.getElementById('saveFileNameInput');
		if (nameInput && !nameInput.value.trim()) nameInput.value = '저장';
		// 모달 열기
		if (modal) {
			modal.hidden = false;
			modal.removeAttribute('hidden');
		}
	});
})();
</script>
