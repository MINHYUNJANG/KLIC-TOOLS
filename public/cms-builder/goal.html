<script>
(function() {
	var pdfBtn = document.getElementById('savePdfButton');
	var modal = document.getElementById('saveFileModal');
	var closeModal = function() {
		if (!modal) return;
		modal.hidden = true;
		modal.setAttribute('hidden', 'hidden');
		var progress = document.getElementById('saveFileProgress');
		if (progress) progress.hidden = true;
		var confirmBtn = document.getElementById('saveFileConfirm');
		if (confirmBtn) confirmBtn.disabled = false;
	};
	document.getElementById('saveFileClose')?.addEventListener('click', closeModal);
	document.getElementById('saveFileCancel')?.addEventListener('click', closeModal);
	document.getElementById('saveFileBackdrop')?.addEventListener('click', closeModal);
	document.addEventListener('keydown', function(event) {
		if (event.key === 'Escape' && modal && !modal.hidden) closeModal();
	});
	if (!pdfBtn) return;
	pdfBtn.addEventListener('click', function() {
		if (window.__builderSaveFileOpenBound === true) return;
		if (window.__builderSaveFileOpenBound === true) return;
		// .klic은 필수 항목으로 항상 선택, PDF/HWPX는 선택 사항으로 해제
		document.querySelectorAll('input[name="saveFileFormat"]').forEach(function(cb) {
			cb.checked = (cb.value === 'klic');
		});
		// 파일명 비어있으면 기본값
		var nameInput = document.getElementById('saveFileNameInput');
		if (nameInput && !nameInput.value.trim()) nameInput.value = '저장';
		// 모달 열기
		if (modal) {
			modal.hidden = false;
			modal.removeAttribute('hidden');
		}
	});
})();
</script>

	<script>
	(function() {
		if (window.__goalBuilderExitConfirmBound === true) return;
		window.__goalBuilderExitConfirmBound = true;

		function escapeHtml(value) {
			return String(value)
				.replace(/&/g, '&amp;')
				.replace(/</g, '&lt;')
				.replace(/>/g, '&gt;')
				.replace(/"/g, '&quot;')
				.replace(/'/g, '&#39;');
		}

		function getBuilderExitText() {
			var rawTitle = document.querySelector('.topbar-title-link strong')?.textContent?.trim() || '교육목표 빌더';
			var title = rawTitle.replace(/\s*빌더\s*$/, '');
			return {
				title: title + ' 빌더를 종료할까요?',
				message: title + ' 빌더로 작성된 내용이 있습니다.\n다른 편집기로 수정하면 빌더 구조가 삭제되어 복원할 수 없습니다.'
			};
		}

		function showExitConfirm() {
			return new Promise(function(resolve) {
				var text = getBuilderExitText();
				var layer = document.createElement('div');
				layer.className = 'klic-confirm-layer';
				layer.innerHTML =
					'<div class="klic-confirm-backdrop" data-confirm-cancel></div>' +
					'<div class="klic-confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="klicConfirmTitle">' +
						'<div class="klic-confirm-icon"><i class="ri-error-warning-line" aria-hidden="true"></i></div>' +
						'<strong id="klicConfirmTitle">' + escapeHtml(text.title) + '</strong>' +
						'<p>' + escapeHtml(text.message).replace(/\n/g, '<br>') + '</p>' +
						'<div class="klic-confirm-actions">' +
							'<button type="button" class="ghost-button" data-confirm-cancel>취소</button>' +
							'<button type="button" class="primary-button" data-confirm-ok>종료</button>' +
						'</div>' +
					'</div>';
				function close(value) {
					document.removeEventListener('keydown', onKeydown);
					layer.remove();
					resolve(value);
				}
				function onKeydown(event) {
					if (event.key === 'Escape') close(false);
				}
				layer.querySelectorAll('[data-confirm-cancel]').forEach(function(el) {
					el.addEventListener('click', function() { close(false); });
				});
				layer.querySelector('[data-confirm-ok]')?.addEventListener('click', function() { close(true); });
				document.addEventListener('keydown', onKeydown);
				document.body.appendChild(layer);
				layer.querySelector('[data-confirm-ok]')?.focus();
			});
		}

		var exitConfirmOpening = false;

		async function confirmExit(href) {
			if (exitConfirmOpening) return false;
			exitConfirmOpening = true;
			var ok = await showExitConfirm();
			exitConfirmOpening = false;
			if (!ok) return false;
			if (href) window.location.href = href;
			else if (window.parent !== window) window.parent.postMessage({ type: 'builderExitConfirmed' }, '*');
			else window.history.back();
			return true;
		}

		window.showGoalBuilderExitConfirm = confirmExit;

		function handleExitEvent(event) {
			var target = event.target.closest && event.target.closest('.topbar-title-link, .topbar-brand a, [data-builder-exit], #builderClose, #builderExit');
			if (!target) return;
			event.preventDefault();
			event.stopPropagation();
			event.stopImmediatePropagation();
			confirmExit(target.getAttribute('href') || '');
		}

		document.addEventListener('click', handleExitEvent, true);
		document.addEventListener('mousedown', handleExitEvent, true);
		window.addEventListener('message', function(event) {
			if (!event.data || !['builderExitRequest', 'requestBuilderExit', 'confirmBuilderExit'].includes(event.data.type)) return;
			confirmExit(event.data.href || '');
		});
		if (window.parent !== window) {
			window.parent.postMessage({ type: 'builderExitConfirmReady' }, '*');
		}
	})();
	</script>

	<script src="/builder/goal/js/content-common.js"></script>
